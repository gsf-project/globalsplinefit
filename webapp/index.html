<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GSF Explorer</title>
  <meta name="description"
        content="Interactive Global Spline Fit — cosmic-ray flux and composition model running fully in your browser." />
  <link rel="preload" href="./fonts/ibm-plex-sans-latin-wght-normal.woff2"
        as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/ibm-plex-mono-latin-400-normal.woff2"
        as="font" type="font/woff2" crossorigin />
  <script>
    // Stamp the theme before first paint: explicit choice wins, else browser.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("gsfTheme") ||
        (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches
          ? "light" : "dark");
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="stylesheet" href="./style.css" />
  <script>
    // Surface early failures on the splash instead of a silent blank page
    // (pre-module syntax on purpose: must run even in very old browsers).
    window.addEventListener("error", function (e) {
      var el = document.querySelector("#splash .stage");
      if (el) el.textContent = "Failed to start: " +
        (e.message || (e.target && (e.target.src || e.target.href)) || "unknown error");
    }, true);
    window.addEventListener("unhandledrejection", function (e) {
      var el = document.querySelector("#splash .stage");
      if (el) el.textContent = "Failed to start: " +
        ((e.reason && e.reason.message) || e.reason || "unknown error");
    });
  </script>
</head>
<body>
  <div id="app">
    <div id="splash">
      <div class="tag">global spline fit</div>
      <div class="name">GSF Explorer</div>
      <div class="bar"></div>
      <div class="stage">Starting…</div>
      <div class="hint">Loading the scientific Python runtime and the
        globalsplinefit package (~25&nbsp;MB, cached after the first
        visit)&hellip;</div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>

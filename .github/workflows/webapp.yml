name: Webapp

on:
  push:
    branches: [ main ]
    paths:
      - "webapp/**"
      - "src/**"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "webapp/**"
      - "src/**"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

concurrency:
  group: webapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI suite (headless chromium vs real Pyodide)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build the wheel the app loads
        run: |
          webapp/update_wheel.sh
          # keep the WHEEL constant in sync with the built version
          WHL=$(basename webapp/globalsplinefit-*.whl)
          sed -i "s|globalsplinefit-[^\"]*\.whl|$WHL|" webapp/main.js

      - name: Install playwright + chromium
        run: |
          uv sync
          uv pip install playwright
          uv run --no-sync playwright install --with-deps chromium

      - name: Run full UI test suite
        working-directory: webapp
        run: uv run --no-sync python test_ui.py

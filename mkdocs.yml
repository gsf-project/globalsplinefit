site_name: GlobalSplineFit
site_description: Cosmic ray flux parametrizations with uncertainty quantification
repo_url: https://github.com/gsf-project/globalsplinefit
repo_name: gsf-project/globalsplinefit

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

# gallery cards link to /gallery/<name>/ pages that exist only in the built
# site (marimo html-wasm exports added by docs.yml after mkdocs build) — the
# links are relative so the site also works from a staging subpath; don't
# fail --strict on them. Broken links between .md pages are still caught.
validation:
  links:
    unrecognized_links: ignore

hooks:
  # renders webapp/citations.json into the pages (single citation source)
  - mkdocs_hooks/citations.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  # explorer.md is a placeholder — the CI build copies the real Explorer app
  # over /explorer/ after mkdocs runs; a relative page link works on any host
  - Explorer: explorer.md
  # tutorial notebooks: marimo html-wasm exports, deployed to /gallery/
  # by docs.yml alongside this site
  - Tutorials: gallery.md
  - Getting Started: getting_started.md
  - User Guide: user_guide.md
  - API Reference: api_reference.md

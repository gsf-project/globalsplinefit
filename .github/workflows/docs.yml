name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra docs

    - name: Build documentation
      run: uv run mkdocs build --strict

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        # keep_files: the GSF Explorer lives at /explorer/ on the same
        # branch and is deployed by release.yml on version tags only —
        # a docs deploy must not wipe it. (Cost: files deleted from the
        # docs also need a manual prune from gh-pages.)
        keep_files: true

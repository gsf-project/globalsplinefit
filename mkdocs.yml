site_name: GlobalSplineFit
site_description: Cosmic ray flux parametrizations with uncertainty quantification
repo_url: https://github.com/gsf-project/globalsplinefit
repo_name: gsf-project/globalsplinefit

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include: ["examples/*.ipynb"]
      execute: true
      allow_errors: false
      include_source: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - User Guide: user_guide.md
  - Tutorials:
    - Cosmic Ray Flux: examples/cosmic_ray_flux.ipynb
    - Nucleon Flux: examples/nucleon_flux.ipynb
    - Solar Modulation: examples/solar_modulation.ipynb
    - Rigidity Cutoff: examples/rigidity_cutoff.ipynb
    - Model Comparison: examples/model_comparison_2017_vs_2025.ipynb
    - Hybrid PCA: examples/HybridPCA.ipynb
  - API Reference: api_reference.md

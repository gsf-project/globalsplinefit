# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
-   repo: local
    hooks:
    # The marimo notebooks in examples/*.py are the source of truth; the
    # committed .ipynb exports next to them feed mkdocs-jupyter and GitHub
    # rendering. Regenerate + stage the export whenever a source changes
    # (the first commit attempt fails with "files were modified"; just
    # commit again). CI re-checks the exports are in sync (test.yml).
    -   id: marimo-export
        name: marimo -> ipynb (examples)
        language: system
        files: ^examples/.*\.py$
        entry: bash -c 'for f in "$@"; do uv run marimo export ipynb --force "$f" -o "${f%.py}.ipynb" && git add "${f%.py}.ipynb"; done' --

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        exclude: ^mkdocs\.yml$
    -   id: check-toml
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: debug-statements

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format

-   repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
    -   id: nbstripout

ci:
    autofix_commit_msg: |
        [pre-commit.ci] auto fixes from pre-commit.com hooks

        for more information, see https://pre-commit.ci
    autofix_prs: true
    autoupdate_branch: ''
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: weekly
    # marimo-export needs uv + the local env; CI checks export freshness
    # in test.yml instead.
    skip: [marimo-export]
    submodules: false

name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra docs

    - name: Build documentation
      run: uv run mkdocs build --strict

    # Tutorial gallery: each example notebook compiled twice — the app view at
    # /gallery/<name>/ and an in-browser editor at /gallery/<name>/edit/
    # (linked from docs/gallery.md); marimo runtime deduped across notebooks.
    - name: Build tutorial gallery (marimo html-wasm)
      run: .github/scripts/build_gallery.sh

    # The WASM notebooks micropip-install the package from /wheels/ on this
    # site, so the gallery always runs the version the docs were built from
    # (see the install cell at the top of each examples/*.py).
    - name: Build wheel for the WASM notebooks
      run: |
        uv build --wheel
        mkdir -p site/wheels
        cp dist/globalsplinefit-*.whl site/wheels/
        printf '{"wheel": "%s"}\n' "$(basename dist/globalsplinefit-*.whl)" > site/wheels/latest.json

    # The gallery pages are only "docs" if they land on figures rather than
    # code and actually render — assert that in a real browser. Runs after the
    # wheel step: the notebooks micropip-install it at boot.
    - name: Install playwright + chromium
      run: |
        uv pip install playwright
        uv run --no-sync playwright install --with-deps chromium

    - name: Check the gallery in a headless browser
      run: uv run --no-sync python .github/scripts/test_gallery.py --fast

    # Replace the docs/explorer.md placeholder with the real app, so every
    # docs deploy ships a current Explorer (release.yml's tag-time deploy to
    # the same path is now just a harmless extra refresh).
    - name: Assemble Explorer into the site
      run: |
        webapp/update_wheel.sh
        rsync -a webapp/ site/explorer/ \
          --exclude __pycache__ \
          --exclude browser_smoke.py --exclude test_ui.py \
          --exclude update_wheel.sh --exclude serve.py

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        # keep_files: the GSF Explorer lives at /explorer/ on the same
        # branch and is deployed by release.yml on version tags only —
        # a docs deploy must not wipe it. (Cost: files deleted from the
        # docs also need a manual prune from gh-pages.)
        keep_files: true

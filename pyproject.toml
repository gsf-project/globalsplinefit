[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globalsplinefit"
version = "2.0.0a1"
description = "Global Spline Fit model for cosmic ray flux and composition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Hans Dembinski", email = "hans.dembinski@gmail.com"},
    {name = "Anatoli Fedynitch", email = "afedynitch@gmail.com"},
]
maintainers = [
    {name = "Anatoli Fedynitch", email = "afedynitch@gmail.com"},
]
keywords = [
    "cosmic rays", "astrophysics", "particle physics",
    "spline fitting", "solar modulation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.5.0",
]
dashboard = [
    "plotly>=5.0.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pytest-benchmark>=4.0",
    "psutil>=4.0",
]
docs = [
    "globalsplinefit[plotting]",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocs-jupyter>=0.24",
    "mkdocstrings[python]>=0.24",
    "ipykernel>=6.0",
]
dev = [
    "globalsplinefit[test,docs,plotting]",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
all = [
    "globalsplinefit[plotting,dashboard,test,docs,dev]",
]

[project.urls]
"Homepage" = "https://github.com/gsf-project/globalsplinefit"
"Bug Reports" = "https://github.com/gsf-project/globalsplinefit/issues"
"Source" = "https://github.com/gsf-project/globalsplinefit"
"Documentation" = "https://gsf-project.github.io/globalsplinefit/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
globalsplinefit = ["data/**/*.dat"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "D",   # pydocstyle (NumPy convention, see [tool.ruff.lint.pydocstyle])
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # Docstring presence rules — don't require docstrings on every object
    "D100",  # missing docstring in public module
    "D101",  # missing docstring in public class
    "D102",  # missing docstring in public method
    "D103",  # missing docstring in public function
    "D104",  # missing docstring in public package
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "S101", "D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "regression: marks tests as regression tests",
]

[tool.coverage.run]
source = ["src/globalsplinefit"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

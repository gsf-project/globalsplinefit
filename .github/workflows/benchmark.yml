name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "*" ]

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra test

    - name: Run benchmarks
      run: |
        uv run pytest tests/test_performance.py -v
